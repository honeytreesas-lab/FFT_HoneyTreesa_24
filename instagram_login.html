<html>
<head>
    <title>Instagram Login</title>

    <style>
        form {
            border: 1px solid black;
            width: 400px;
            margin-left: 450px;
            margin-top: 80px;
            padding: 30px;
            box-shadow: 2px 4px 8px black;
            
            
        }

        h1 {
            text-align: center;
            font-style: italic;
        }

        input {
            width: 390px;
            height: 40px;
            margin-bottom: 15px;
            background-color: rgb(244, 238, 238);
        }

        #i1 {
            width: 390px;
            height: 45px;
            background-color: rgb(49, 145, 220);
            color: white;
            border: none;
            border-radius: 5px;
        }

        #i1:hover {
            background-color: rgb(20, 100, 180);
        }

        #i2 {
            width: 390px;
            height: 40px;
            border: none;
            background-color: white;
            color: rgb(0, 119, 255);
        }

        #i2:hover {
            color: black;
        }

     
        

        #i4 {
            width: 390px;
            height: 45px;
            border: 1px solid rgb(0, 119, 255);
            background-color: white;
            color: rgb(0, 119, 255);
            border-radius: 5px;
        }

        #i4:hover {
            background-color: rgb(0, 119, 255);
            color: white;
        }

        p {
            text-align: center;
        }
    </style>
</head>

<body>

    <form>
        <h1>Instagram</h1>

        <input type="text" placeholder="Phone number, email or username" required>

        <input type="password" placeholder="Password" required>

        <button id="i1">Log In</button>

        <p>
            <button id="i2">Forgot password</button>
        </p>


        <button id="i4">Create new account</button>

        <p>Don't have an account?Sign Up</p>
    </form>

</body>
</html>
