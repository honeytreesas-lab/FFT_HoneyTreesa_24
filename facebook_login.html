<html>
<head>
    <title>Facebook Login</title>

    <style>
        body {
            background-color: rgb(10, 25, 35);
            font-family: Arial;
            justify-content: center;
            
        }

        form {
            width: 400px;
            margin-left: 450px;
            margin-top: 80px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 45px;
        }

        input {
            width: 390px;
            height: 50px;
            margin-bottom: 15px;
            background-color: rgb(25, 45, 55);
            border: 1px solid rgb(80, 110, 120);
            border-radius: 15px;
            color: white;
            padding-left: 10px;
            box-sizing: border-box;
        }

        input::placeholder {
            color: rgb(160, 170, 175);
        }

        #i1 {
            width: 390px;
            height: 50px;
            background-color: rgb(0, 115, 255);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
        }

        #i1:hover {
            background-color: rgb(0, 90, 210);
        }

        #i2 {
            background-color: transparent;
            border: none;
            color: white;
            font-size: 16px;
        }

        #i2:hover {
            text-decoration: underline;
        }

        #i3 {
            width: 390px;
            height: 50px;
            background-color: transparent;
            border: 2px solid rgb(0, 115, 255);
            color: rgb(0, 115, 255);
            border-radius: 25px;
            font-size: 18px;
        }

        #i3:hover {
            background-color: rgb(0, 115, 255);
            color: white;
        }

        p {
            color: white;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <form>

        <h1>facebook</h1>

        <input type="text" placeholder="Mobile number or email address" required>

        <input type="password" placeholder="Password" required>

        <button id="i1">Log In</button>

        <br><br>

        <button id="i2">Forgotten Password?</button>

        <br><br><br><br><br><br>

        <button id="i3">Create new account</button>

        <p>Meta</p>

    </form>

</body>
</html>
